name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          python3 tests/test_release_notes.py
          swift test

      - name: Build app
        run: |
          ./scripts/build-app.sh
          codesign --verify --strict --verbose=2 dist/CherryTools.app
          lipo dist/CherryTools.app/Contents/MacOS/CherryTools -verify_arch arm64

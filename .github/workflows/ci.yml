name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run tests
        run: |
          python3 tests/test_release_notes.py
          swift test

      - name: Build app
        run: |
          ./scripts/build-app.sh
          codesign --verify --strict --verbose=2 dist/CherryTools.app
          signature="$(codesign -dv dist/CherryTools.app 2>&1)"
          [[ "$signature" == *"flags="*"runtime"* ]]
          lipo dist/CherryTools.app/Contents/MacOS/CherryTools -verify_arch arm64
